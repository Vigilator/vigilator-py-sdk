[project]
name = "vigilator-py-sdk"
version = "0.1.0"
description = "This is the SDK for the vigilator API."
authors = [{ name = "Vigilator", email = "noah@vigilator.ai" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.1",
    "httpx-retries>=0.6.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://vigilator.github.io/vigilator-py-sdk/"
Repository = "https://github.com/vigilator/vigilator-py-sdk"
Documentation = "https://vigilator.github.io/vigilator-py-sdk/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "ty>=0.0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "datamodel-code-generator[http]>=0.69.0",
    "poethepoet>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vigilator_py_sdk"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.10"

[tool.ty.src]
exclude = ["vigilator_py_sdk/models.py"] # As is auto generated

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
extend-exclude = ["models.py"] # As is auto generated

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
    # pydocstyle
    "D",
    # pep8-naming
    "N",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "TRY003"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["vigilator_py_sdk"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.poe.tasks]
regen = """datamodel-codegen --url http://localhost:3000/api/spec.json
--input-file-type openapi
--openapi-scopes schemas paths
--output vigilator_py_sdk/models.py
--allow-private-network
"""
